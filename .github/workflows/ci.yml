name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend + tests
        run: dotnet restore "ShoeblexAI.slnx"

      - name: Build backend + tests
        run: dotnet build "ShoeblexAI.slnx" --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test "tests/ContractSense.Api.Tests/ContractSense.Api.Tests.csproj" --configuration Release --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run --prefix frontend build
